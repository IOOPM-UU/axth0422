name: Automatic Tests

on:
  pull_request:

jobs:
  automatic_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get install -y gcc libcunit1 libcunit1-doc libcunit1-dev valgrind

      - name: Change Dir
        run: cd ./inluppar/inlupp1
        
      - name: Compile Source Code
        run: gcc -Wall -Wextra -pedantic -g hash_table.c hash_table_tests.c -o test.out -lcunit

      - name: Run Tests
        run: valgrind --leak-check=full -s ./test.out